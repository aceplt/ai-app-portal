<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI News — AI Create App News</title>
    <link rel="stylesheet" href="./style.css" />
    <meta name="description" content="Latest AI news and community app submissions" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html">AI Create App News</a>
        <nav class="nav">
          <a href="./index.html">Home</a>
          <a href="./news.html" class="active">AI News</a>
          <a href="./apps.html">Apps</a>
          <a href="./submit.html" class="cta">Submit App</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="card-head">
          <h1>AI News</h1>
          <div class="filters">
            <input id="newsQuery" class="input" placeholder="Search news…" />
            <select id="newsSourceFilter" class="select" aria-label="News source">
              <option value="all">All sources</option>
            </select>
            <button id="newsRefresh" class="btn btn-small">Refresh</button>
          </div>
        </div>
        <div id="newsListFull" class="list"></div>
      </section>

      <footer class="footer">
        <div class="muted">© <span id="year"></span> AI Create App News</div>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
