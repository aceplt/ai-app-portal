<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — AI Create App News</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="./index.html">AI Create App News</a>
        <nav class="nav">
          <a href="./index.html">Home</a>
          <a href="./news.html">AI News</a>
          <a href="./apps.html">Apps</a>
          <a href="./submit.html" class="cta">Submit App</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="card-head">
          <h1>Admin (placeholder)</h1>
          <p class="muted">Local demo auto-approvals using votes + ratings + review count.</p>
        </div>

        <div class="status" id="autoStatus"></div>

        <div class="form-row" style="margin-top:10px; align-items:flex-start; flex-wrap:wrap;">
          <label style="gap:8px; min-width: 220px">
            Min votes (auto-approve)
            <input id="thresholdInput" class="input" type="number" min="1" value="25" />
          </label>

          <label style="gap:8px; min-width: 220px">
            Min reviews (auto-approve)
            <input id="minReviewsInput" class="input" type="number" min="1" value="10" />
          </label>

          <label style="gap:8px; min-width: 220px">
            Min average rating (1–5)
            <input id="minRatingInput" class="input" type="number" step="0.1" min="1" max="5" value="4" />
          </label>

          <label style="gap:8px; min-width: 220px">
            Min age before approval (hours)
            <input id="minAgeHoursInput" class="input" type="number" min="0" value="2" />
          </label>

          <div style="display:flex; flex-direction:column; gap:10px; margin-left:auto;">
            <button id="runAutoApprove" class="btn">Run auto-approve now</button>
            <button id="clearDemo" class="btn btn-ghost">Clear local demo data</button>
          </div>
        </div>

        <h2 style="margin-top:18px">Pending submissions</h2>
        <div id="pendingList" class="list"></div>
      </section>

      <footer class="footer">
        <div class="muted">© <span id="year"></span> AI Create App News</div>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
